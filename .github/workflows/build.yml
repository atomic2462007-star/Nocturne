k
name: Build APK
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: |
          ls -la
          Z=$(find . -iname '*.zip' | head -n1)
          echo "Found zip: $Z"
          unzip -q "$Z"
          ls -la
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - run: gradle assembleRelease --no-daemon
        working-directory: EReader
      - uses: actions/upload-artifact@v4
        with:
          name: EReader-apk
          path: EReader/app/build/outputs/apk/release/*.apk
